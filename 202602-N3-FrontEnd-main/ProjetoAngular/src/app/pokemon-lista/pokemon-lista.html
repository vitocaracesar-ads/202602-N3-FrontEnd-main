<div class="row g-3 mt-2">
  @for (p of pokemons; track p.id) {
  <div class="col-6 col-md-3">
    <div class="card text-center h-100">
      <img [src]="p.imagem" class="card-img-top" [alt]="p.nome">
      <div class="card-body">
        <small class="text-muted">#{{ p.id }}</small>
        <h5 class="card-title text-capitalize">{{ p.nome }}</h5>
        <a [routerLink]="['/pokemon', p.id]" class="btn btn-primary">Detalhes</a>
      </div>
    </div>
  </div>
  }
</div>
